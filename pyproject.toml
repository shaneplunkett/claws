[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claws"
version = "0.1.0"
description = "Agent hooks for Claude Code and Codex"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
claws-bap = "claws.cli.bap:main"
claws-install = "claws.cli.install:main"
claws-manifest = "claws.cli.manifest:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
claws = ["fixtures/*/*.jsonl", "baps/*/bap.nix", "baps/*/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/claws/baps"]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_explicit = true
mypy_path = "src"
packages = ["claws"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
